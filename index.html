<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인공지능 윤리 메모리 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5FB; --panel:#FFFFFF; --ink:#1D2B44; --sub:#5B6B82; --line:#D5E0EC;
  --blue:#1E4FB0; --blue2:#2F6BDE; --yellow:#F5A623; --good:#1F9D55; --bad:#E0473C;
  --back1:#1E4FB0; --back2:#163C87;
  --shadow:0 3px 0 rgba(30,79,176,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1A2C; --panel:#18253B; --ink:#EAF1FB; --sub:#A9B8CE; --line:#2B3B57; --shadow:0 3px 0 rgba(0,0,0,.3); }
}
:root[data-theme="dark"]{ --bg:#0F1A2C; --panel:#18253B; --ink:#EAF1FB; --sub:#A9B8CE; --line:#2B3B57; --shadow:0 3px 0 rgba(0,0,0,.3); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
button{ font:inherit; cursor:pointer; }
button:focus-visible,.card:focus-visible{ outline:3px solid var(--yellow); outline-offset:3px; }
.wrap{ max-width:1240px; margin:0 auto; padding:18px 20px 28px; }
.display{ font-family:"Jua","Noto Sans KR",sans-serif; font-weight:400; }

/* 상단 */
.top{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
.title{ font-size:28px; margin:0; color:var(--blue); line-height:1.2; }
.title span{ color:var(--yellow); }
.round{ display:inline-block; margin-top:4px; font-size:15px; font-weight:700; color:var(--sub); }
.round b{ color:var(--ink); }
.stats{ display:flex; gap:8px; flex-wrap:wrap; }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 14px; text-align:center; min-width:84px; }
.stat small{ display:block; font-size:12px; color:var(--sub); }
.stat strong{ font-size:18px; }

/* 판 */
.board{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
.card{ perspective:1000px; aspect-ratio:3/4.35; border:0; padding:0; background:none; position:relative; }
.inner{ position:absolute; inset:0; transition:transform .45s cubic-bezier(.3,.8,.3,1); transform-style:preserve-3d; }
.card.open .inner, .card.matched .inner{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; border-radius:14px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }
.back{ background:var(--back1); background-image:radial-gradient(circle at 20% 15%, rgba(255,255,255,.14) 0 18%, transparent 19%), radial-gradient(circle at 85% 80%, rgba(245,166,35,.35) 0 22%, transparent 23%);
  border:3px solid #fff; box-shadow:0 4px 0 var(--back2); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
.back .q{ font-family:"Jua",sans-serif; font-size:clamp(34px,4.2vw,56px); line-height:1; color:var(--yellow); text-shadow:0 3px 0 rgba(0,0,0,.2); }
.back .lbl{ font-family:"Jua",sans-serif; font-size:clamp(12px,1.2vw,16px); margin-top:6px; opacity:.95; }
.front{ transform:rotateY(180deg); background:#fff; border:3px solid #CBD5E1; display:flex; flex-direction:column; color:#1D2B44; }
.tag{ font-size:11px; font-weight:700; text-align:center; padding:4px 0; background:#EEF2F7; color:#4B5B73; letter-spacing:.02em; }
/* 원칙 카드 */
.front.p .pname{ font-family:"Jua",sans-serif; text-align:center; font-size:clamp(14px,1.45vw,20px); padding:8px 4px 2px; line-height:1.15; }
.front.p img{ width:78%; margin:4px auto 0; display:block; aspect-ratio:1; object-fit:contain; }
.front.p .hint{ margin-top:auto; font-size:11px; color:#6B7A90; text-align:center; padding:6px 6px 8px; }
/* 사례 카드 */
.front.c img{ width:100%; aspect-ratio:1.62; object-fit:cover; display:block; }
.front.c .txt{ font-size:clamp(10.5px,.9vw,12px); line-height:1.36; padding:7px 8px 8px; word-break:keep-all; overflow:hidden; }
.card.matched .front{ border-color:var(--pc); box-shadow:0 0 0 2px var(--pc) inset; }
.card.matched .front::after{ content:"✓"; position:absolute; top:2px; right:4px; width:18px; height:18px; border-radius:50%; background:var(--pc); color:#fff; font-weight:700; font-size:11px; display:grid; place-items:center; }
.card.wrong .inner{ animation:shake .45s; }
@keyframes shake{ 0%,100%{transform:rotateY(180deg)} 25%{transform:rotateY(180deg) translateX(-6px)} 50%{transform:rotateY(180deg) translateX(6px)} 75%{transform:rotateY(180deg) translateX(-3px)} }
.card.wrong .front{ border-color:var(--bad); }

/* 설명 줄 */
.explain{ margin-top:14px; min-height:64px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow); }
.explain .dot{ flex:none; width:12px; height:12px; border-radius:50%; background:var(--line); }
.explain p{ margin:0; font-size:15px; line-height:1.5; }
.explain b{ font-weight:700; }
.explain.ok .dot{ background:var(--good); }
.explain.no .dot{ background:var(--bad); }

/* 오버레이 */
.overlay{ position:fixed; inset:0; background:rgba(15,26,44,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
.overlay[hidden]{ display:none; }
.modal{ background:var(--panel); color:var(--ink); border-radius:20px; padding:26px 26px 22px; width:min(560px,100%); max-height:calc(100% - 20px); overflow:auto; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.12); }
.modal h2{ font-size:30px; margin:0 0 6px; color:var(--blue); }
.modal p{ margin:6px 0; color:var(--sub); line-height:1.6; }
.chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:14px 0 6px; }
.chip{ font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; color:#fff; }
.btn{ display:inline-block; margin-top:16px; background:var(--blue); color:#fff; border:0; border-radius:14px; padding:12px 26px; font-family:"Jua",sans-serif; font-size:21px; box-shadow:0 4px 0 var(--back2); }
.btn:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--back2); }
.btn.ghost{ background:transparent; color:var(--blue); box-shadow:none; border:2px solid var(--blue); font-size:17px; padding:8px 18px; }
.result{ display:flex; justify-content:center; gap:10px; margin-top:10px; }
.result .stat strong{ font-size:22px; }

/* 마무리 */
.final{ width:min(1000px,100%); text-align:left; }
.final h2{ text-align:center; }
.final .lead{ text-align:center; }
.cmp{ margin-top:14px; display:grid; gap:10px; }
.row{ display:grid; grid-template-columns:150px 1fr 28px 1fr; gap:10px; align-items:center; background:var(--bg); border-radius:14px; padding:10px; }
.row .pn{ font-family:"Jua",sans-serif; font-size:17px; display:flex; align-items:center; gap:8px; }
.row .pn i{ width:10px; height:34px; border-radius:6px; flex:none; }
.side{ display:flex; gap:10px; align-items:center; background:var(--panel); border-radius:10px; padding:8px; font-size:13.5px; line-height:1.45; word-break:keep-all; }
.side img{ width:64px; height:50px; object-fit:cover; border-radius:6px; flex:none; }
.side em{ display:block; font-style:normal; font-weight:700; font-size:11.5px; margin-bottom:2px; }
.side.n em{ color:var(--bad); } .side.g em{ color:var(--good); }
.arrow{ text-align:center; font-size:20px; color:var(--sub); }
.center{ text-align:center; }

@media (max-width:1020px){ .board{ grid-template-columns:repeat(4,1fr); } .front.c .txt{ font-size:13px; } .front.p .pname{ font-size:20px; } }
@media (max-width:560px){ .board{ grid-template-columns:repeat(3,1fr); gap:8px; } .title{ font-size:22px; } .front.c .txt{ font-size:11px; }
  .row{ grid-template-columns:1fr; } .arrow{ transform:rotate(90deg); } }
@media (prefers-reduced-motion:reduce){ .inner{ transition:none; } .card.wrong .inner{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 class="title display">인공지능 윤리 <span>메모리 게임</span></h1>
      <div class="round" id="roundLabel"></div>
    </div>
    <div class="stats">
      <div class="stat"><small>맞춘 짝</small><strong id="sPairs">0 / 7</strong></div>
      <div class="stat"><small>뒤집은 횟수</small><strong id="sMoves">0</strong></div>
      <div class="stat"><small>시간</small><strong id="sTime">0:00</strong></div>
    </div>
  </div>
  <div class="board" id="board" aria-label="카드 판"></div>
  <div class="explain" id="explain" aria-live="polite"><span class="dot"></span><p id="explainText">원칙 카드와 그 원칙에 맞는 사례 카드를 짝지어 보세요.</p></div>
</div>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

  {k:'safe', name:'안전성', color:'#1E4FB0', mean:'AI로 인해 사람과 사회에 피해나 위험이 생기지 않도록 안전조치를 마련해야 합니다.',
   n:'AI 상담 챗봇이 위험한 상황에 놓인 사람에게 부적절하거나 위험한 행동을 권한다', nw:'위험한 상황에 있는 사람에게 AI가 잘못된 말을 하면 큰 피해로 이어질 수 있어요.',
   g:'AI 상담 챗봇이 사용자가 위험한 상황인 것을 발견하면 전문가나 보호자의 도움을 받을 수 있도록 안내한다', gw:'위험을 알아채고 사람의 도움으로 이어 주는 것이 AI의 안전장치예요.'},
  {k:'priv', name:'프라이버시 보호', color:'#6B35E0', mean:'개인정보와 사생활을 소중히 여기고 정보가 함부로 모이거나 퍼지지 않도록 보호 조치를 마련해야 합니다.',
   n:'인공지능(AI) 앱이 사용자 동의없이 위치 정보나 대화 내용을 수집한다', nw:'동의 없이 내 위치나 대화를 모으면, 나도 모르게 사생활이 새어 나가요.',
   g:'AI 앱이 위치 정보를 필요한 범위에서만 수집하고, 어떤 목적으로 사용하는지 미리 알린다', gw:'필요한 만큼만 모으고 목적을 미리 알리면, 내 정보를 스스로 지킬 수 있어요.'},
];
const PM = Object.fromEntries(P.map(p=>[p.k,p]));
const ROUNDS = { 1:{label:'1라운드', sub:'원칙이 지켜지지 않았을 때', side:'n'}, 2:{label:'2라운드', sub:'원칙이 지켜졌을 때', side:'g'} };

let round=1, deck=[], opened=[], lock=false, pairs=0, moves=0, t0=0, timer=null, results={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function build(){
  const side = ROUNDS[round].side;
  deck = shuffle(P.flatMap(p=>[{t:'p',k:p.k},{t:'c',k:p.k}]));
  opened=[]; lock=false; pairs=0; moves=0;
  $('roundLabel').innerHTML = `<b>${ROUNDS[round].label}</b> · ${ROUNDS[round].sub}`;
  $('board').innerHTML = deck.map((c,i)=>{
    const p = PM[c.k];
    const front = c.t==='p'
      ? `<div class="face front p"><div class="tag">원칙 카드</div><div class="pname" style="color:${p.color}">${esc(p.name)}</div><img src="${IMG['p_'+p.k]}" alt=""><div class="hint">짝이 되는 사례를 찾아요</div></div>`
      : `<div class="face front c"><div class="tag">사례 카드</div><img src="${IMG[side+'_'+p.k]}" alt=""><div class="txt">${esc(p[side])}</div></div>`;
    return `<button class="card" data-i="${i}" style="--pc:${p.color}" aria-label="뒤집힌 카드 ${i+1}"><div class="inner"><div class="face back"><div class="q">?</div><div class="lbl">AI 윤리</div></div>${front}</div></button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>flip(+el.dataset.i)));
  setExplain('', ROUNDS[round].side==='n' ? '원칙 카드와, 그 원칙이 <b>지켜지지 않은</b> 사례 카드를 짝지어 보세요.' : '원칙 카드와, 그 원칙이 <b>지켜진</b> 사례 카드를 짝지어 보세요.');
  updateStats();
  clearInterval(timer); t0=Date.now(); timer=setInterval(()=>{ $('sTime').textContent=fmt(Date.now()-t0); },500);
  $('sTime').textContent='0:00';
}
function updateStats(){ $('sPairs').textContent=`${pairs} / 7`; $('sMoves').textContent=moves; }
function setExplain(kind, html){ const e=$('explain'); e.className='explain'+(kind?' '+kind:''); $('explainText').innerHTML=html; }
function el(i){ return document.querySelector(`.card[data-i="${i}"]`); }
function label(i){ const c=deck[i], p=PM[c.k]; return c.t==='p' ? `원칙 카드: ${p.name}` : `사례 카드: ${p[ROUNDS[round].side]}`; }

function flip(i){
  if(lock) return;
  const c=deck[i]; const e=el(i);
  if(c.done || opened.includes(i)) return;
  e.classList.add('open'); e.setAttribute('aria-label', label(i));
  opened.push(i);
  if(opened.length<2) return;
  moves++; updateStats();
  const [a,b]=opened.map(x=>deck[x]);
  if(a.k===b.k && a.t!==b.t){
    a.done=b.done=true;
    opened.forEach(x=>{ const ee=el(x); ee.classList.remove('open'); ee.classList.add('matched'); ee.disabled=true; });
    opened=[]; pairs++; updateStats();
    const p=PM[a.k], side=ROUNDS[round].side;
    setExplain('ok', `<b style="color:${p.color}">${esc(p.name)}</b> 짝 성공! ${esc(p[side+'w'])}`);
    if(pairs===7) finishRound();
  } else {
    lock=true;
    opened.forEach(x=>el(x).classList.add('wrong'));
    setExplain('no', a.t===b.t ? (a.t==='p' ? '원칙 카드끼리는 짝이 될 수 없어요. 원칙과 사례를 하나씩 뒤집어요.' : '사례 카드끼리는 짝이 될 수 없어요. 원칙과 사례를 하나씩 뒤집어요.') : '아쉬워요! 이 사례는 다른 원칙과 짝이에요. 카드 위치를 기억해 두세요.');
    setTimeout(()=>{ opened.forEach(x=>{ const ee=el(x); ee.classList.remove('open','wrong'); ee.setAttribute('aria-label','뒤집힌 카드 '+(x+1)); }); opened=[]; lock=false; }, 1300);
  }
}

function finishRound(){
  clearInterval(timer);
  results[round]={moves, time:Date.now()-t0};
  setTimeout(()=>{
    if(round===1){
      showModal(`<h2 class="display">1라운드 완료!</h2>
        <p>원칙이 <b>지켜지지 않은</b> 사례 7개를 모두 찾았어요.</p>
        <div class="result"><div class="stat"><small>뒤집은 횟수</small><strong>${results[1].moves}</strong></div><div class="stat"><small>걸린 시간</small><strong>${fmt(results[1].time)}</strong></div></div>
        <p style="margin-top:14px">이번엔 같은 상황에서 원칙이 <b>잘 지켜진</b> 모습을 찾아볼까요?</p>
        <button class="btn" id="next">2라운드 시작</button>`);
      $('next').onclick=()=>{ hideModal(); round=2; build(); };
    } else {
      showFinal();
    }
  }, 700);
}

function showFinal(){
  const rows = P.map(p=>`<div class="row"><div class="pn"><i style="background:${p.color}"></i>${esc(p.name)}</div>
    <div class="side n"><img src="${IMG['n_'+p.k]}" alt=""><div><em>지켜지지 않았을 때</em>${esc(p.n)}</div></div>
    <div class="arrow">→</div>
    <div class="side g"><img src="${IMG['g_'+p.k]}" alt=""><div><em>지켜졌을 때</em>${esc(p.g)}</div></div></div>`).join('');
  showModal(`<div class="final"><h2 class="display">두 라운드 모두 완료!</h2>
    <p class="lead">같은 상황이 원칙을 지키면 어떻게 달라지는지 비교해 보세요.</p>
    <div class="result"><div class="stat"><small>1라운드</small><strong>${results[1].moves}회 · ${fmt(results[1].time)}</strong></div><div class="stat"><small>2라운드</small><strong>${results[2].moves}회 · ${fmt(results[2].time)}</strong></div></div>
    <div class="cmp">${rows}</div>
    <div class="center"><button class="btn" id="again">처음부터 다시</button></div></div>`, true);
  $('again').onclick=()=>{ hideModal(); round=1; results={}; build(); };
}

function showModal(html, wide){ const m=$('modal'); m.innerHTML=html; m.style.width = wide ? 'min(1040px,100%)' : ''; $('ov').hidden=false; m.scrollTop=0; const b=m.querySelector('button'); b && b.focus({preventScroll:true}); }
function hideModal(){ $('ov').hidden=true; }

// 시작 화면
showModal(`<h2 class="display">인공지능 윤리 메모리 게임</h2>
  <p>원칙 카드와 사례 카드를 뒤집어 <b>짝</b>을 찾아요.<br>맞으면 카드가 그대로 열려 있고, 틀리면 다시 뒤집혀요.</p>
  <div class="chips">${P.map(p=>`<span class="chip" style="background:${p.color}">${esc(p.name)}</span>`).join('')}</div>
  <p><b>1라운드</b> 원칙이 지켜지지 않았을 때 &nbsp;·&nbsp; <b>2라운드</b> 원칙이 지켜졌을 때</p>
  <button class="btn" id="start">1라운드 시작</button>`);
$('start').onclick=()=>{ hideModal(); build(); };
</script>
</body>
</html>
